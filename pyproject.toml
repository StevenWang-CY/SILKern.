[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silkern"
version = "0.1.0"
description = "SILKern: sparse-index localization kernels for context-parallel decode - deterministic, allocation-free, CUDA-graph-safe"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "sparse-attention",
    "context-parallelism",
    "determinism",
    "cuda-graphs",
    "triton",
    "llm-inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# The contract and the oracle are pure Python by design: the base install
# works on a laptop with no GPU stack present, and torch/triton are opt-in.
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.4", "triton>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/StevenWang-CY/SILKern"
Repository = "https://github.com/StevenWang-CY/SILKern"
Issues = "https://github.com/StevenWang-CY/SILKern/issues"
Evidence = "https://github.com/StevenWang-CY/SILKern/tree/main/evidence"
Documentation = "https://github.com/StevenWang-CY/SILKern/tree/main/docs"

[project.scripts]
silkern-verify = "silkern.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["silkern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker or a config key should fail the run, not be ignored: the
# `gpu` deselection is what keeps CI honest about what it did and did not check.
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "gpu: requires a CUDA device and Triton (deselect with -m 'not gpu')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Triton kernels are carried verbatim from the qualified implementation.
# Reformatting them would invalidate the recorded conformance evidence.
"silkern/kernels.py" = ["E741"]
