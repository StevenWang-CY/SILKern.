[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silkern"
version = "2.1.0"
description = "Deterministic sparse-index localization for CUDA/Triton and Apple silicon/MLX"
# Index descriptions need absolute links; README.md remains the full repo guide.
readme = "docs/package-description.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "sparse-attention",
    "context-parallelism",
    "determinism",
    "cuda-graphs",
    "triton",
    "mlx",
    "apple-silicon",
    "llm-inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# The contract and the oracle are pure Python by design: the base install
# works on a laptop with no GPU stack present, and torch/triton are opt-in.
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.4", "triton>=3.0"]
mlx = ["mlx>=0.32.3,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "fonttools>=4.47"]
docs = ["fonttools>=4.47"]

[project.urls]
Homepage = "https://github.com/StevenWang-CY/SILKern."
Repository = "https://github.com/StevenWang-CY/SILKern."
Issues = "https://github.com/StevenWang-CY/SILKern./issues"
Evidence = "https://github.com/StevenWang-CY/SILKern./tree/main/evidence"
Documentation = "https://github.com/StevenWang-CY/SILKern./tree/main/docs"

[project.scripts]
silkern-verify = "silkern.verify:main"
silkern-verify-mlx = "silkern.mlx_verify:main"

[tool.hatch.build.targets.wheel]
packages = ["silkern"]

# An explicit list keeps local tool folders and caches out of a source release
# built from a working checkout. Hatch adds pyproject.toml and the license files.
[tool.hatch.build.targets.sdist]
include = [
    "/silkern",
    "/tests",
    "/bench",
    "/examples",
    "/docs",
    "/assets",
    "/evidence",
    "/tools",
    "/conftest.py",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker or a config key should fail the run, not be ignored: the
# `gpu` deselection is what keeps CI honest about what it did and did not check.
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "gpu: requires a CUDA device and Triton (deselect with -m 'not gpu')",
    "mlx: requires optional MLX (deselect with -m 'not mlx')",
    "metal: requires an Apple Metal GPU (deselect with -m 'not metal')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The Triton kernels are carried verbatim from the qualified implementation.
# Reformatting them would invalidate the recorded conformance evidence.
"silkern/kernels.py" = ["E741"]
