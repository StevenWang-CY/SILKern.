</g></defs><title id="title">Layout-aware masking, paged gathering and a shared softmax</title>
<desc id="desc">Panel a compares compact slots [14,12,-1,-1] with mask [1,1,0,0] to preserved columns [14,-1,12,-1] with mask [1,0,1,0]. Both counts are 2. Panel b substitutes address zero for invalid positions, gathers K/V, then selects zero for invalid gathered values. Unused cache slot zero may contain NaN, so both masks are needed. Indexed K and V matrices show placeholder row zero and selected rows 12 and 14. Each four-cell row is a schematic feature vector, not its actual dimension. Solid routes carry values and dashed routes carry validity. Panel c masks invalid logits to negative infinity, computes one maximum over all logical shards and positions, and selects zero for invalid weights. An empty selection sets the maximum to zero. Sums N of weighted values and Z of weights are combined in one division; if Z=0, the output is zero. Valid arithmetic must be finite and representable. This illustrates a one-device consumer, not a distributed runtime.</desc>
