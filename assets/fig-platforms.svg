<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="588" viewBox="0 0 1120 588" role="img" aria-labelledby="title desc">
<title id="title">Sparse selections become ordered rank-local KV addresses</title>
<desc id="desc">Selections pass through SILKern, a masked KV gather and selected attention. Panel a uses rank zero of two ranks, interleave one, page size 64, request zero, and page table [11,2,7,5]. Input [8,5,130,7,-1,262] has validity [1,0,1,0,0,1]. The surviving slots 708,129,451 receive prefix-derived destinations 0,1,2; the compacted result is [708,129,451,-1,-1,-1], count 3. Panel b maps logical pages 0,1,2 to physical pages 11,2,7. Each cache grid contains 64 K/V entries; selected offsets 4,1,3 give slots 708,129,451. Physical pages are drawn in ascending order to distinguish physical placement from selector order. Page-table entry 3 maps to page 5 but is unused. This is the multi-rank compacting layout.</desc>
<style>svg{--ink:#202832;--muted:#58616c;--line:#84909b;--rule:#d4dbe1;--paper:#ffffff;--neutral:#f1f3f5;--comparison:#b5bfca;--blue:#32669b;--blue-wash:#e8f0f8;--teal:#287c72;--teal-wash:#e7f2ef;--copper:#a16a3b;--copper-wash:#f7eddf;--violet:#786a9e;--violet-wash:#eeebf5;--knockout:#ffffff}@media(prefers-color-scheme:dark){svg{--ink:#e8edf2;--muted:#aab4bf;--line:#8d9aa8;--rule:#37424d;--paper:#0d1117;--neutral:#1b232c;--comparison:#778696;--blue:#8ab7e6;--blue-wash:#172c43;--teal:#80c4b4;--teal-wash:#17322e;--copper:#dfb17e;--copper-wash:#392c20;--violet:#b6a7da;--violet-wash:#292338;--knockout:#111820}}text{font-family:'Arial','DejaVu Sans',sans-serif;font-size:18px;font-variant-numeric:tabular-nums;fill:var(--ink)}.heading{font-size:22px;font-weight:700}.subhead{font-weight:700}.muted{fill:var(--muted)}.data{font-weight:400}.data.knockout{font-weight:700}
.rule{fill:none;stroke:var(--rule);stroke-width:1}
