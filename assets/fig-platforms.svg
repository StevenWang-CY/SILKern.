<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="404" viewBox="0 0 1120 404" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Sparse-index localization at the attention boundary</title>
<desc id="overview-desc">Left: selected global positions enter SILKern and leave as rank-local slots and exact counts for a masked KV gather and attention consumer. Right: the localization operation is expanded into ownership and bounds predicates, local-coordinate calculation, page translation, a validity prefix sum, and stable scatter. The validity mask determines both destinations and count; translation reads only valid pages and supplies values without reordering them. Output storage starts with minus-one padding. For rank zero with two ranks, interleave one, block size64, request zero and pages11,2,7,5, tokens8,5,130,7,minus one,262 become slots708,129,451,minus one,minus one,minus one and count3. This is the compacting path; single-rank and noncompacting layouts preserve columns. The graph describes semantics shared by Python, MLX/Metal and CUDA/Triton, not a fixed kernel-launch schedule.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#202020}
.math{font-family:Georgia,"Times New Roman",serif;font-size:15px;font-style:italic}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.small{font-size:12px}.muted{fill:#5d5d5d}.blue{fill:#245a96}.node{fill:none;stroke:#555;stroke-width:1}
.edge{fill:none;stroke:#555;stroke-width:1;marker-end:url(#arrow)}.branch{fill:#555}
.expand{fill:none;stroke:#8c8c8c;stroke-width:.8;stroke-dasharray:4 4}
.cell{fill:none;stroke:#8a8a8a;stroke-width:.8}.selected{fill:none;stroke:#245a96;stroke-width:1.2}
@media(prefers-color-scheme:dark){text{fill:#e6e6e6}.muted{fill:#a6a6a6}.blue{fill:#8eb5de}.node,.edge{stroke:#b5b5b5}.branch{fill:#b5b5b5}.expand,.cell{stroke:#777}.selected{stroke:#8eb5de}}
</style>
