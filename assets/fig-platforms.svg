<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="544" viewBox="0 0 1120 544" role="img" aria-labelledby="title desc">
<title id="title">Ownership, paged translation and deterministic compaction</title>
<desc id="desc">Three panels expand one call on rank zero with two ranks, interleave one, page size 64 and request zero. Panel a classifies global positions [8,5,130,7,-1,262] by owner, keeps rank zero, and deinterleaves to local positions [4,-,65,-,-,131]. The valid mask is [1,0,1,0,0,1]. Panel b shows request page table P=[11,2,7,5], the surviving page-offset pairs (0,4),(1,1),(2,3), and their physical addresses 708,129,451. Panel c computes inclusive validity prefixes minus one; only valid destinations 0,1,2 are used. Colored routes carry each surviving address to its stable output position, yielding [708,129,451,-1,-1,-1] and count 3. Filled and empty bit marks reinforce numeric validity. This illustrates multi-rank front compaction; the single-rank and non-compacting paths preserve columns. SILKern returns addresses and counts; K/V gathering and attention remain consumer operations.</desc>
<style>svg{--ink:#242424;--muted:#636363;--line:#777777;--rule:#d8d8d8;--paper:#ffffff;--comparison:#b9bec3;--blue:#355e8a;--blue-wash:#e8f0f8;--teal:#47786d;--teal-wash:#e7f2ef;--copper:#9d6444;--copper-wash:#f7eddf;--violet:#786791;--violet-wash:#eeebf5}@media(prefers-color-scheme:dark){svg{--ink:#e8edf2;--muted:#aab4bf;--line:#8d9aa8;--rule:#37424d;--paper:#0d1117;--comparison:#778696;--blue:#8ab7e6;--blue-wash:#172c43;--teal:#80c4b4;--teal-wash:#17322e;--copper:#dfb17e;--copper-wash:#392c20;--violet:#b6a7da;--violet-wash:#292338}}text{font-family:'Arial','DejaVu Sans',sans-serif;font-size:18px;font-variant-numeric:tabular-nums;fill:var(--ink)}.heading{font-size:20px;font-weight:400}.panel,.key{font-weight:700}.subhead{font-weight:400}.math{font-style:italic}.muted{fill:var(--muted)}.data{font-weight:400}.emphasis{font-weight:700}
