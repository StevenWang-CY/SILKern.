<svg xmlns="http://www.w3.org/2000/svg" width="420" height="652" viewBox="0 0 420 652" role="img" aria-labelledby="title desc">
<title id="title">Archived CUDA converter latency and complete decode cost</title>
<desc id="desc">Panel a: at 32K context the 48-layer converter segment takes 119.996 microseconds rowwise, 194.393 atomic and 239.727 hierarchical; rowwise is 38.3% lower than atomic. Bars start at zero and labels round to one decimal place. Panel b: complete-step latency ratios against atomic with 98.75% intervals over 5 sessions, on a 0.995 to 1.020 axis. The solid line marks equal latency and the dashed line the prespecified 1.01 margin, with the region beyond it shaded; the numeric column repeats each estimate and interval. Rowwise at 64K is 1.014006 times atomic, and its interval lies beyond the margin, a measured regression; the other contrasts meet the margin. These are historical two-H100 reference-executor results, not serving-runtime performance; no NVIDIA experiments were run for this update. Source: evidence/05-full-decode-canary/segments.json and analysis.json.</desc>
