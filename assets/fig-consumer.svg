<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Layout-aware masking, safe K/V gathering, and shared softmax reduction</title>
  <desc id="desc">Three computation panels. A compact prefix with slots 14, 12, minus one, minus one uses the mask one, one, zero, zero. A column-preserving layout with slots 14, minus one, 12, minus one uses one, zero, one, zero. Both have count two. Panel B replaces invalid gather addresses with zero, gathers keys and values, and then masks the gathered values so NaN padding cannot propagate. Panel C uses a maximum shared across all logical shards and positions, zeroes invalid weights, sums weighted values and weights across the complete selected set, and divides once. An empty selection returns zero.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#171717}
    .muted{fill:#525252}.blue{fill:#245a96}.small{font-size:12px}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:16px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.outline{fill:none;stroke:#171717;stroke-width:1}.rule{fill:none;stroke:#e5e5e5;stroke-width:1}.active{fill:none;stroke:#245a96;stroke-width:2}.arrow{fill:none;stroke:#171717;stroke-width:1;marker-end:url(#arrow)}.head{fill:#171717}
    @media(prefers-color-scheme:dark){text{fill:#e5e5e5}.muted{fill:#a3a3a3}.blue{fill:#8eb5de}.outline,.arrow{stroke:#e5e5e5}.rule{stroke:#303030}.active{stroke:#8eb5de}.head{fill:#e5e5e5}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="head" d="M0 1 7 4 0 7Z"/></marker></defs>
  <path class="rule" d="M362 43V405M729 43V405"/>
  <text x="28" y="25">(a) Layout-dependent validity</text>
  <text x="386" y="25">(b) Safe gather and value masking</text>
  <text x="752" y="25">(c) Shared softmax reduction</text>

  <text class="small muted" x="28" y="61">D &gt; 1, compacted</text><text class="small muted" x="322" y="61" text-anchor="end">count = 2</text>
  <text class="math" x="30" y="98">s</text>
  <path class="outline" d="M66 77H306V111H66ZM126 77V111M186 77V111M246 77V111"/>
  <g class="mono" text-anchor="middle"><text x="96" y="99">14</text><text x="156" y="99">12</text><text class="muted" x="216" y="99">−1</text><text class="muted" x="276" y="99">−1</text></g>
  <path class="active" d="M67 111H185"/>
  <text class="math" x="30" y="140">v</text>
  <g class="mono" text-anchor="middle"><text class="blue" x="96" y="140">1</text><text class="blue" x="156" y="140">1</text><text class="muted" x="216" y="140">0</text><text class="muted" x="276" y="140">0</text></g>
  <text class="math" x="186" y="175" text-anchor="middle">vⱼ = [ j &lt; count ]</text>

  <text class="small muted" x="28" y="221">D = 1, or no compaction</text><text class="small muted" x="322" y="221" text-anchor="end">count = 2</text>
  <text class="math" x="30" y="258">s</text>
  <path class="outline" d="M66 237H306V271H66ZM126 237V271M186 237V271M246 237V271"/>
  <g class="mono" text-anchor="middle"><text x="96" y="259">14</text><text class="muted" x="156" y="259">−1</text><text x="216" y="259">12</text><text class="muted" x="276" y="259">−1</text></g>
  <path class="active" d="M67 271H125M187 271H245"/>
  <text class="math" x="30" y="300">v</text>
  <g class="mono" text-anchor="middle"><text class="blue" x="96" y="300">1</text><text class="muted" x="156" y="300">0</text><text class="blue" x="216" y="300">1</text><text class="muted" x="276" y="300">0</text></g>
  <text class="math" x="186" y="335" text-anchor="middle">vⱼ = input-column validity</text>
  <path class="active" d="M67 377H87"/><text class="small muted" x="98" y="381">valid position</text>

  <text class="math" x="392" y="72">s</text><text class="mono" x="448" y="72">[14, −1, 12, −1]</text>
  <text class="math" x="392" y="105">v</text><text class="mono blue" x="448" y="105">[ 1,  0,  1,  0]</text>
  <path class="arrow" d="M425 67H435V150H448M551 116V133"/>
  <rect class="outline" x="448" y="134" width="206" height="31"/>
  <text class="mono" x="551" y="154" text-anchor="middle">where(v, s, 0)</text>
  <path class="arrow" d="M551 165V180"/>
  <text class="mono" x="551" y="198" text-anchor="middle">[14, 0, 12, 0]</text>
  <path class="arrow" d="M551 207V220M683 237H615"/>
  <rect class="outline" x="487" y="221" width="128" height="31"/>
  <text x="551" y="242" text-anchor="middle">gather K / V</text>
  <text class="math" x="680" y="222" text-anchor="end">cache</text>
  <path class="arrow" d="M551 252V269"/>
  <text class="math" x="551" y="287" text-anchor="middle">[ x₁₄, x₀, x₁₂, x₀ ]</text>
  <path class="arrow" d="M551 296V310M420 102V327H448"/>
  <rect class="outline" x="448" y="311" width="206" height="31"/>
  <text class="mono" x="551" y="331" text-anchor="middle">where(v, x, 0)</text>
  <path class="arrow" d="M551 342V358"/>
  <text class="math" x="551" y="378" text-anchor="middle">[ x₁₄, 0, x₁₂, 0 ]</text>
  <text class="small muted" x="551" y="403" text-anchor="middle">x ∈ {K, V}; unused x₀ may be NaN.</text>

  <text class="math" x="925" y="65" text-anchor="middle">zᵣⱼ = q · Kᵣⱼ / √d</text>
  <text class="small muted" x="925" y="86" text-anchor="middle">invalid zᵣⱼ ← −∞</text>
  <path class="arrow" d="M925 97V114M797 96V200H815"/>
  <path class="outline" d="M797 96H925"/>
  <rect class="outline" x="850" y="115" width="150" height="31"/>
  <text class="math" x="925" y="136" text-anchor="middle">m = maxᵣ,ⱼ zᵣⱼ</text>
  <path class="arrow" d="M925 146V182"/>
  <text class="small muted" x="996" y="166" text-anchor="middle">empty: m ← 0</text>
  <rect class="outline" x="815" y="183" width="276" height="35"/>
  <text class="math" x="953" y="206" text-anchor="middle">wᵣⱼ = vᵣⱼ ? exp(zᵣⱼ − m) : 0</text>
  <path class="arrow" d="M953 218V230H850V244M953 230H1028V278M791 257H836"/>
  <text class="math" x="770" y="262">Vᵣⱼ</text>
  <circle class="outline" cx="850" cy="257" r="13"/><text class="math" x="850" y="263" text-anchor="middle">×</text>
  <path class="arrow" d="M850 270V278"/>
  <circle class="outline" cx="850" cy="294" r="16"/><text class="math" x="850" y="300" text-anchor="middle">Σ</text>
  <circle class="outline" cx="1028" cy="294" r="16"/><text class="math" x="1028" y="300" text-anchor="middle">Σ</text>
  <text class="small muted" x="925" y="297" text-anchor="middle">over r, j</text>
  <path class="arrow" d="M850 310V345H925M1028 310V345H953"/>
  <text class="math" x="861" y="334">N</text><text class="math" x="1000" y="334">Z</text>
  <circle class="outline" cx="939" cy="345" r="14"/><text class="math" x="939" y="351" text-anchor="middle">÷</text>
  <path class="arrow" d="M939 359V376"/>
  <text class="math" x="939" y="399" text-anchor="middle">y = N / Z if Z &gt; 0; otherwise 0</text>
</svg>
