<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="516" viewBox="0 0 1120 516" role="img" aria-labelledby="title desc">
<title id="title">Layout-aware masking, paged gathering and a shared softmax</title>
<desc id="desc">Panel a compares compact slots [14,12,-1,-1] with mask [1,1,0,0] to preserved columns [14,-1,12,-1] with mask [1,0,1,0]. Both counts are 2. Panel b substitutes address zero for invalid positions, gathers K/V, then selects zero for invalid gathered values. Unused cache slot zero may contain NaN, so both masks are needed. A 16-slot grid highlights entries 12 and 14. Panel c masks invalid logits to negative infinity, computes one maximum over all logical shards and positions, and selects zero for invalid weights. An empty selection sets the maximum to zero. Sums N of weighted values and Z of weights are combined in one division; if Z=0, the output is zero. Valid arithmetic must be finite and representable. This illustrates a one-device consumer, not a distributed runtime.</desc>
<style>svg{--ink:#202832;--muted:#58616c;--line:#84909b;--rule:#d4dbe1;--paper:#ffffff;--neutral:#f1f3f5;--comparison:#b5bfca;--blue:#32669b;--blue-wash:#e8f0f8;--teal:#287c72;--teal-wash:#e7f2ef;--copper:#a16a3b;--copper-wash:#f7eddf;--violet:#786a9e;--violet-wash:#eeebf5;--knockout:#ffffff}@media(prefers-color-scheme:dark){svg{--ink:#e8edf2;--muted:#aab4bf;--line:#8d9aa8;--rule:#37424d;--paper:#0d1117;--neutral:#1b232c;--comparison:#778696;--blue:#8ab7e6;--blue-wash:#172c43;--teal:#80c4b4;--teal-wash:#17322e;--copper:#dfb17e;--copper-wash:#392c20;--violet:#b6a7da;--violet-wash:#292338;--knockout:#111820}}text{font-family:'Arial','DejaVu Sans',sans-serif;font-size:18px;font-variant-numeric:tabular-nums;fill:var(--ink)}.heading{font-size:22px;font-weight:700}.subhead{font-weight:700}.muted{fill:var(--muted)}.data{font-weight:400}.data.knockout{font-weight:700}
.rule{fill:none;stroke:var(--rule);stroke-width:1}
.edge{fill:none;stroke:var(--line);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.outline{fill:var(--paper);stroke:var(--line);stroke-width:1.2}
.grid-frame,.array-frame{fill:none;stroke:var(--line);stroke-width:1}
.wash{fill:var(--wash);stroke:none}.plain{fill:var(--paper);stroke:none}
.array-divider{fill:none;stroke:var(--rule);stroke-width:.8}
.port{fill:var(--paper);stroke:var(--color);stroke-width:1.25}
.route-cutout{fill:none;stroke:var(--paper);stroke-width:5;stroke-linecap:round}
.blue{--color:var(--blue);--wash:var(--blue-wash)}
.teal{--color:var(--teal);--wash:var(--teal-wash)}
.copper{--color:var(--copper);--wash:var(--copper-wash)}
.violet{--color:var(--violet);--wash:var(--violet-wash)}
.colored{fill:var(--color)}.tile{fill:var(--wash);stroke:var(--color);stroke-width:1.25}
.trace{fill:none;stroke:var(--color);stroke-width:1.7;stroke-linecap:round}
.solid{fill:var(--color);stroke:var(--color);stroke-width:1}
.knockout{fill:var(--knockout)}
</style>
