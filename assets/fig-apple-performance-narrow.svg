<svg xmlns="http://www.w3.org/2000/svg" width="420" height="637" viewBox="0 0 420 637" role="img" aria-labelledby="title desc">
<title id="title">Apple M5 Max compiled localization and selected-attention latency</title>
<desc id="desc">Grouped bar chart of median latency per synchronized call on Apple M5 Max with MLX 0.32.3, on one zero-based 0 to 400 microsecond scale. For each geometry a blue bar gives the compiled custom Metal kernel and a gray bar compiled compositional MLX, and the ratio of the two is set above the pair. The left group is localization at selection widths 128, 2,048, 4,096 and batch sizes 1, 8, 32; Metal is 1.10 to 1.21 times faster. The right group is complete selected attention with two logical shards on one device, fixed caches and 64-dimensional keys and values: batch 1 with width 128, 1.12 times; batch 8 with width 2,048, 1.12 times. Each ratio is compiled MLX latency divided by compiled Metal latency. Values are medians of three process-session medians and include dispatch, allocation, execution and synchronization; warmup and first-use compilation are excluded. Compiled Metal was faster in all 33 session pairs; per-session ratios range from 1.10 to 1.77 for localization because one of three sessions ran slower for both arms. Source: evidence/09-apple-mlx-consumer/summary.json, consumer-summary.json and the session records.</desc>
