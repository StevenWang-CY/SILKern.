<title id="figure-title">Archived CUDA converter and complete-step measurements</title><desc id="figure-desc">At 32K, the complete 48-layer converter segment takes 119.996 microseconds rowwise, 194.393 atomic, and 239.727 hierarchical. Whole-step ratios with 98.75 percent intervals show rowwise at 64K is 1.014006 times atomic, above the prespecified 1.01 margin. All other contrasts meet the margin. These are historical two-H100 results.</desc><style>svg{--paper:#f5f5f0;--ink:#262a2a;--muted:#676f6d;--grid:#dadcd5;--line:#c6cdc8}@media(prefers-color-scheme:dark){svg{--paper:#171d1c;--ink:#eef0eb;--muted:#abb8b1;--grid:#3b4842;--line:#53685e}}</style>
