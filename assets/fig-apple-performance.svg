<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="529" viewBox="0 0 1120 529" role="img" aria-labelledby="title desc">
<title id="title">Apple M5 Max compiled localization and selected-attention latency</title>
<desc id="desc">Dot plot of median latency per synchronized call on Apple M5 Max with MLX 0.32.3, on one zero-based 0 to 400 microsecond scale. Each row joins compiled compositional MLX (hollow gray dot) and the compiled custom Metal kernel (filled blue dot). The first 9 rows are localization at selection widths 128, 2,048, 4,096 and batch sizes 1, 8, 32; Metal is 1.10 to 1.21 times faster. The last 2 rows are complete selected attention with two logical shards on one device, fixed caches and 64-dimensional keys and values: batch 1 with width 128, 1.12 times; batch 8 with width 2,048, 1.12 times. The right-hand column gives each speedup, compiled MLX latency divided by compiled Metal latency. Values are medians of three process-session medians and include dispatch, allocation, execution and synchronization; warmup and first-use compilation are excluded. Source: evidence/09-apple-mlx-consumer/summary.json and consumer-summary.json.</desc>
