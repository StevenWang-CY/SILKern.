<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="328" viewBox="0 0 1120 328" role="img" aria-labelledby="problem-title problem-desc">
  <title id="problem-title">Tile reservation order versus stable prefix order</title>
  <desc id="problem-desc">Two illustrative routing diagrams use tile groups T0=[704,705], T1=[132,133], T2=[448,896], and T3=[897,260]. In panel a, tile completion-dependent atomic reservations permute complete tile groups. The first replay routes T1,T0,T3,T2; the next two show T0,T2,T1,T3 and T2,T3,T0,T1. Panel b uses input-prefix destinations and emits T0,T1,T2,T3 on all three replays. Both converters preserve the same eight values and exact count; order within each tile group is unchanged. Blue tracks group T0. These paths and replay values are illustrative, not measurements.</desc>
