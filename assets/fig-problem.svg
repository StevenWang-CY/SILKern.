    text { font: 14px Arial, Helvetica, sans-serif; fill: #171717; font-weight: 400; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font-size: 13px; }
    .muted { fill: #525252; }
    .blue { fill: #245a96; }
    .rule { fill: none; stroke: #d4d4d4; stroke-width: 1; }
    .edge { fill: none; stroke: #737373; stroke-width: 1; }
    .trace { fill: none; stroke: #245a96; stroke-width: 1; }
    .cell { fill: none; stroke: #a3a3a3; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e5e5; }
      .muted { fill: #a3a3a3; }
      .blue { fill: #8eb5de; }
      .rule { stroke: #404040; }
      .edge { stroke: #a3a3a3; }
      .trace { stroke: #8eb5de; }
      .cell { stroke: #737373; }
    }
  </style>
