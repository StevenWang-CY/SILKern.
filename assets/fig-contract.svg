<text x="740" y="90" class="" text-anchor="start">owner = ⌊t / I⌋ mod D</text>
<text x="740" y="128" class="" text-anchor="start">ℓ = ⌊t / (D I)⌋ I + t mod I</text>
<text x="740" y="166" class="" text-anchor="start">(b, δ) = divmod(ℓ, S)</text>
<text x="740" y="204" class="" text-anchor="start">a = P[request, b] S + δ</text>
