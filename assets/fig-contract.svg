  <rect class="trace" x="274" y="432" width="72" height="30"/>
  <text x="310" y="453" class="mono" text-anchor="middle">708</text>
  <rect class="trace" x="414" y="432" width="72" height="30"/>
  <text x="450" y="453" class="mono" text-anchor="middle">129</text>
  <rect class="trace" x="554" y="432" width="72" height="30"/>
  <text x="590" y="453" class="mono" text-anchor="middle">451</text>
  <rect class="cell" x="694" y="432" width="72" height="30"/>
  <text x="730" y="453" class="mono muted" text-anchor="middle">-1</text>
  <rect class="cell" x="834" y="432" width="72" height="30"/>
  <text x="870" y="453" class="mono muted" text-anchor="middle">-1</text>
  <rect class="cell" x="974" y="432" width="72" height="30"/>
  <text x="1010" y="453" class="mono muted" text-anchor="middle">-1</text>
