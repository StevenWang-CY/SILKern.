  <text x="310" y="74" class="mono" text-anchor="middle">8</text>
  <rect class="cell" x="414" y="53" width="72" height="30"/>
  <text x="450" y="74" class="mono" text-anchor="middle">5</text>
  <rect class="cell" x="554" y="53" width="72" height="30"/>
