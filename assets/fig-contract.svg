<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" viewBox="0 0 1120 432" role="img" aria-labelledby="title desc">
<title id="title">Coordinate translation and the two output layouts</title>
<desc id="desc">For D=2, rank=0, I=1, S=64, request zero and P=[11,2,7,5], tokens 8,130,262 survive at columns 0,2,5. Their local positions 4,65,131 give page-offset pairs (0,4),(1,1),(2,3) and physical slots 708,129,451. The other tokens belong to rank one or are negative. General formulas for nonnegative t appear at right. P is read only for an owned, in-range mapping. Front compaction returns [708,129,451,-1,-1,-1]; with compaction off the result is [708,-1,129,-1,-1,451]. Both counts are 3, but only the compacted row has a valid count-length prefix. Single-rank calls also preserve columns, with their own coordinate translation.</desc>
<style>svg{--ink:#242424;--muted:#636363;--line:#777777;--rule:#d8d8d8;--paper:#ffffff;--comparison:#b9bec3;--blue:#355e8a;--blue-wash:#e8f0f8;--teal:#47786d;--teal-wash:#e7f2ef;--copper:#9d6444;--copper-wash:#f7eddf;--violet:#786791;--violet-wash:#eeebf5}@media(prefers-color-scheme:dark){svg{--ink:#e8edf2;--muted:#aab4bf;--line:#8d9aa8;--rule:#37424d;--paper:#0d1117;--comparison:#778696;--blue:#8ab7e6;--blue-wash:#172c43;--teal:#80c4b4;--teal-wash:#17322e;--copper:#dfb17e;--copper-wash:#392c20;--violet:#b6a7da;--violet-wash:#292338}}text{font-family:'Arial','DejaVu Sans',sans-serif;font-size:18px;font-variant-numeric:tabular-nums;fill:var(--ink)}.heading{font-size:20px;font-weight:400}.panel,.key{font-weight:700}.subhead{font-weight:400}.math{font-style:italic}.muted{fill:var(--muted)}.data{font-weight:400}.emphasis{font-weight:700}
.rule{fill:none;stroke:var(--rule);stroke-width:1}
.edge{fill:none;stroke:var(--line);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.outline{fill:var(--paper);stroke:var(--ink);stroke-width:1.05}
.tensor-bracket{fill:none;stroke:var(--line);stroke-width:1.1}
.control{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 3}
.junction{fill:var(--line);stroke:none}
.memory{fill:var(--paper);stroke:var(--line);stroke-width:1}
.memory-active{fill:var(--wash);stroke:var(--color);stroke-width:1}
.tensor-cell{fill:var(--wash);stroke:var(--color);stroke-width:1}
.mask-bit{fill:var(--color);stroke:none}
.mask-zero{fill:none;stroke:var(--rule);stroke-width:1}
.math-index{font-size:75%}
.array-divider{fill:none;stroke:var(--rule);stroke-width:.8}
.route-cutout{fill:none;stroke:var(--paper);stroke-width:5;stroke-linecap:round}
.blue{--color:var(--blue);--wash:var(--blue-wash)}
.teal{--color:var(--teal);--wash:var(--teal-wash)}
.copper{--color:var(--copper);--wash:var(--copper-wash)}
.violet{--color:var(--violet);--wash:var(--violet-wash)}
.colored{fill:var(--color)}
.trace{fill:none;stroke:var(--color);stroke-width:1.3;stroke-linecap:round}
</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
