  <rect class="cell" x="834" y="53" width="72" height="30"/>
  <text x="870" y="74" class="mono" text-anchor="middle">-1</text>
  <rect class="cell" x="974" y="53" width="72" height="30"/>
  <text x="1010" y="74" class="mono" text-anchor="middle">262</text>
  <text x="32" y="124">Owner  t mod 2</text>
  <path class="trace" d="M310 83V105"/>
  <path class="trace" d="M307 101L310 105L313 101"/>
  <text x="310" y="124" class="mono muted" text-anchor="middle">0</text>
  <path class="edge" d="M450 83V105"/>
  <path class="edge" d="M447 101L450 105L453 101"/>
  <text x="450" y="124" class="mono muted" text-anchor="middle">1</text>
  <path class="edge" d="M450 136V146"/>
  <path class="edge" d="M446 146L454 154M454 146L446 154"/>
  <path class="trace" d="M590 83V105"/>
  <path class="trace" d="M587 101L590 105L593 101"/>
  <text x="590" y="124" class="mono muted" text-anchor="middle">0</text>
  <path class="edge" d="M730 83V105"/>
  <path class="edge" d="M727 101L730 105L733 101"/>
  <text x="730" y="124" class="mono muted" text-anchor="middle">1</text>
  <path class="edge" d="M730 136V146"/>
  <path class="edge" d="M726 146L734 154M734 146L726 154"/>
  <path class="edge" d="M870 83V105"/>
  <path class="edge" d="M867 101L870 105L873 101"/>
  <text x="870" y="124" class="mono muted" text-anchor="middle">invalid</text>
  <path class="edge" d="M870 136V146"/>
  <path class="edge" d="M866 146L874 154M874 146L866 154"/>
