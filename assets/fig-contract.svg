<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="contract-title contract-desc">
  <title id="contract-title">Worked localization and stable-compaction example</title>
  <desc id="contract-desc">Panel a follows input tokens [8, 5, 130, 7, -1, 262] through ownership filtering and page translation. With block size 64, two ranks, rank zero, interleave one, request zero and page table [11, 2, 7, 5], source columns zero, two and five survive. Local tokens [4, 65, 131] translate to physical slots [708, 129, 451]. Panel b shows validity bits [1,0,1,0,0,1] and the prefix-scan destinations zero, one and two. Source-order-preserving scatter produces [708,129,451,-1,-1,-1] with exact count three. In-range page values are translated verbatim, including negative page IDs; this example uses populated positive pages.</desc>
  <style>
    text { font: 14px Arial, Helvetica, sans-serif; fill: #171717; font-weight: 400; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font-size: 13px; }
    .muted { fill: #525252; }
    .blue { fill: #245a96; }
    .rule { fill: none; stroke: #d4d4d4; stroke-width: 1; }
    .edge { fill: none; stroke: #737373; stroke-width: 1; }
    .trace { fill: none; stroke: #245a96; stroke-width: 1; }
    .cell { fill: none; stroke: #a3a3a3; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e5e5; }
      .muted { fill: #a3a3a3; }
      .blue { fill: #8eb5de; }
      .rule { stroke: #404040; }
      .edge { stroke: #a3a3a3; }
      .trace { stroke: #8eb5de; }
      .cell { stroke: #737373; }
    }
  </style>
  <text x="32" y="23">(a) Ownership and translation</text>
  <text x="1088" y="23" class="small mono" text-anchor="end">block=64; D=2; rank=0; interleave=1; request=0; P=[11,2,7,5]</text>
  <text x="32" y="74">Global token  t</text>
