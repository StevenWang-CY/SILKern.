<text x="447" y="507" class="small muted" text-anchor="middle">count = 3 · stable filter, not a sort</text>
<text x="742" y="28" class="heading" text-anchor="start">b  Coordinates and layout</text>
<text x="742" y="66" class="small muted" text-anchor="start">For nonnegative t</text>
<text x="742" y="94" class="math" text-anchor="start">owner = ⌊t / I⌋ mod D</text>
<text x="742" y="127" class="math" text-anchor="start">ℓ = ⌊t / (D I)⌋ I + t mod I</text>
<text x="742" y="160" class="math" text-anchor="start">(b, δ) = divmod(ℓ, S)</text>
<text x="742" y="193" class="math" text-anchor="start">a = P[request, b] S + δ</text>
<text x="742" y="221" class="small muted" text-anchor="start">Read P only for an owned, in-range mapping.</text>
<path d="M742 239H1098" class="rule"/>
