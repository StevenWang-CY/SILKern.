  <text x="32" y="310">(b) Stable compaction</text>
  <text x="32" y="344">Valid mapping  v</text>
  <text x="310" y="344" class="mono" text-anchor="middle">1</text>
  <text x="450" y="344" class="mono" text-anchor="middle">0</text>
  <text x="590" y="344" class="mono" text-anchor="middle">1</text>
  <text x="730" y="344" class="mono" text-anchor="middle">0</text>
  <text x="870" y="344" class="mono" text-anchor="middle">0</text>
  <text x="1010" y="344" class="mono" text-anchor="middle">1</text>
  <text x="32" y="381" class="small">Destination  cumsum(v) − 1</text>
  <text x="310" y="381" class="mono" text-anchor="middle">0</text>
  <text x="450" y="381" class="mono muted" text-anchor="middle">—</text>
  <text x="590" y="381" class="mono" text-anchor="middle">1</text>
  <text x="730" y="381" class="mono muted" text-anchor="middle">—</text>
  <text x="870" y="381" class="mono muted" text-anchor="middle">—</text>
  <text x="1010" y="381" class="mono" text-anchor="middle">2</text>
